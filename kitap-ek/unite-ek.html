<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Ünite Eki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%232fb8c6%22/></svg>">
<link rel="stylesheet" href="../assets/css/style.css?v=3" />
<style>
  @page { size: A4; margin: 16mm 15mm; }
  body { background: #fff; max-width: 700px; margin: 0 auto; }
  .ek-tag { font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); margin-bottom: 10px; }
  .ek-q { page-break-inside: avoid; margin-bottom: 20px; }
  .ek-q-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .ek-q-no { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); font-weight: 700; }
  .ek-q-ctx { font-size: 12px; color: var(--gas-dark); font-weight: 700; background: rgba(47,184,198,.1); padding: 2px 9px; border-radius: 999px; }
  .ek-q-text { font-size: 13.5px; color: var(--ink); font-weight: 600; margin: 8px 0 10px; }
  .ek-opts { display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
  .ek-opts .opt { display:flex; gap:8px; }
  .ek-opts .letter { font-weight: 800; color: var(--ink-faint); min-width: 16px; }
  .ek-answer { font-size: 12px; background: var(--surface-2); border-left: 3px solid var(--gas); border-radius: 6px; padding: 8px 12px; }
  .ek-answer b { color: var(--gas-dark); }
  .gl-visual { margin: 6px 0 10px; }
  .gl-chart { max-width: 380px; }
  .gl-vessel-svg { width: 100px; }
</style>
</head>
<body>
<div id="content"></div>

<script type="module">
  import { QUIZ } from "../assets/js/quiz-data.js?v=3";
  import { renderQuestionVisual } from "../assets/js/quiz-engine.js?v=3";

  const params = new URLSearchParams(location.search);
  const unitKey = params.get("unit") || "kmt";

  const VISUAL_FIELDS = ["table", "chart", "compareChart", "statements", "dialogue", "matchPairs", "checklist", "gasContainer", "particleModel", "balloons"];
  const LETTERS = ["A", "B", "C", "D", "E"];
  const questions = (QUIZ[unitKey] || []).filter(q => VISUAL_FIELDS.some(f => q[f]));

  const content = document.getElementById("content");
  questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "ek-q";
    card.innerHTML = `
      <div class="ek-q-head">
        <span class="ek-q-no">EK SORU ${i + 1}</span>
        ${q.context ? `<span class="ek-q-ctx">${q.context}</span>` : ""}
      </div>
    `;
    const visual = renderQuestionVisual(q);
    if (visual) card.appendChild(visual);
    const textEl = document.createElement("div");
    textEl.className = "ek-q-text";
    textEl.textContent = q.text;
    card.appendChild(textEl);
    const optsEl = document.createElement("div");
    optsEl.className = "ek-opts";
    q.options.forEach((opt, oi) => {
      const row = document.createElement("div");
      row.className = "opt";
      row.innerHTML = `<span class="letter">${LETTERS[oi]})</span><span>${opt}</span>`;
      optsEl.appendChild(row);
    });
    card.appendChild(optsEl);
    const ans = document.createElement("div");
    ans.className = "ek-answer";
    ans.innerHTML = `<b>Cevap: ${LETTERS[q.correct]}</b> — ${q.explain}`;
    card.appendChild(ans);
    content.appendChild(card);
  });
</script>
</body>
</html>
